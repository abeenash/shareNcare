name: AI eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: Workers AI model to test
        required: true
        default: "@cf/google/gemma-4-26b-a4b-it"

permissions:
  contents: read

jobs:
  help-me-write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with: 
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the eval letters through the real model
        working-directory: apps/api
        run: bun run eval:help-me-write
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_EVAL_TOKEN }}
          AI_MODEL: ${{ inputs.model }}