name: Sweep old trash

on: 
    schedule:
        #Every day at 03:17 UTC
        - cron: "17 3 * * *"
    workflow_dispatch:

permissions: {}

jobs:
    sweep:
        name: Delete letters past their 30 days
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
             HEARTBEAT_URL: ${{ secrets.SWEEP_HEARTBEAT_URL }}
        steps:
            - name: Ask the app to sweep
              env:
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
              run: >-
                  curl --fail-with-body --silent --show-error
                  --retry 5 --retry-all-errors --retry-delay 30
                  --max-time 180
                  --request POST
                  --header "Authorization: Bearer $CRON_SECRET"
                  https://sharencare.abinasha.com.np/api/internal/sweep-trash

            - name: Tell the heartbeat monitor it worked
              if: success() && env.HEARTBEAT_URL != ''
              run: curl --fail --silent --show-error --retry 3 --max-time 10 "$HEARTBEAT_URL"

            - name: Tell the heartbeat monitor it worked
              if: failure() && env.HEARTBEAT_URL != ''
              run: curl --fail --silent --show-error --retry 3 --max-time 10 "$HEARTBEAT_URL/fail"